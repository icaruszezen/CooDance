name: Build & Release CooDance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build Web & Verify CLI Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (skip Electron binary on Linux build check)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Typecheck & build all workspaces
        run: npm run build
      - name: Run 5-stage Code-as-Video CLI smoke test
        env:
          COODANCE_WORKSPACE: /tmp/coodance-ci-workspace
          COODANCE_CONFIG_DIR: /tmp/coodance-ci-config
        run: |
          git config --global user.name "CooDance CI"
          git config --global user.email "ci@coodance.local"
          node scripts/init-project.mjs ci-smoke --demo
          node scripts/tts.mjs ci-smoke --provider local --speed 1.05
          node scripts/fetch-logo.mjs ci-smoke github --name github
          node scripts/fetch-tg-emoji.mjs ci-smoke audio-bars --name audio-bars
          node scripts/generate-sfx.mjs ci-smoke click
          node scripts/inspect-assets.mjs ci-smoke --thumbs 4
          node scripts/validate-edit-plan.mjs ci-smoke
          node scripts/snapshot.mjs ci-smoke "CI smoke verification"
          node scripts/snapshot.mjs ci-smoke --list
          node -e '
            import("./packages/mcp/dist/server.js").then(async () => {
              const { spawn } = await import("node:child_process");
              const proc = spawn(process.execPath, ["packages/mcp/dist/stdio.js"], { stdio: ["pipe", "pipe", "pipe"] });
              let buf = "";
              proc.stdout.on("data", (d) => { buf += d.toString(); });
              proc.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 1, method: "initialize", params: { protocolVersion: "2024-11-05", capabilities: {}, clientInfo: { name: "ci", version: "1.0.0" } } }) + "\n");
              proc.stdin.write(JSON.stringify({ jsonrpc: "2.0", method: "notifications/initialized", params: {} }) + "\n");
              proc.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }) + "\n");
              await new Promise((r) => setTimeout(r, 1200));
              proc.kill();
              if (!buf.includes("coodance_import_asset") || !buf.includes("coodance_save_edit_plan")) {
                throw new Error("MCP stdio tools/list smoke check failed: " + buf);
              }
              console.log("MCP stdio smoke check passed");
            });
          '

  build-desktop:
    name: Build Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            cmd: npm run desktop:build:win
            artifact: CooDance-Windows-x64
            cache_paths: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
          - label: macOS arm64
            os: macos-latest
            cmd: npm run desktop:build:mac:arm64
            artifact: CooDance-macOS-arm64
            cache_paths: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - label: macOS x64
            os: macos-latest
            cmd: >-
              npm run build &&
              npm ci --no-audit --no-fund --cpu=x64 --ignore-scripts &&
              npm_config_arch=x64 node node_modules/ffmpeg-static/install.js &&
              npm run package:mac:x64 --workspace=@coodance/desktop
            artifact: CooDance-macOS-x64
            cache_paths: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron & electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_paths }}
          key: electron-builder-${{ matrix.artifact }}-${{ hashFiles('apps/desktop/electron-builder.yml', 'package-lock.json') }}
          restore-keys: |
            electron-builder-${{ matrix.artifact }}-
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Build and package desktop installers
        run: ${{ matrix.cmd }}
      - name: Smoke-test packaged Electron app & offline MCP stdio
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { spawn } = require("node:child_process");

            const exeCandidates = process.platform === "win32"
              ? ["release/win-unpacked/CooDance Studio.exe"]
              : [
                  "release/mac-arm64/CooDance Studio.app/Contents/MacOS/CooDance Studio",
                  "release/mac/CooDance Studio.app/Contents/MacOS/CooDance Studio",
                ];
            const exePath = exeCandidates.map((p) => path.resolve(p)).find((p) => fs.existsSync(p));
            if (!exePath) throw new Error("Packaged Electron executable not found: " + exeCandidates.join(", "));

            const mcpCandidates = process.platform === "win32"
              ? ["release/win-unpacked/resources/mcp/stdio.mjs"]
              : [
                  "release/mac-arm64/CooDance Studio.app/Contents/Resources/mcp/stdio.mjs",
                  "release/mac/CooDance Studio.app/Contents/Resources/mcp/stdio.mjs",
                ];
            const mcpPath = mcpCandidates.map((p) => path.resolve(p)).find((p) => fs.existsSync(p));
            if (!mcpPath) throw new Error("Packaged MCP stdio.mjs not found: " + mcpCandidates.join(", "));

            async function runAppSmoke() {
              const os = require("node:os");
              const resultFile = path.join(os.tmpdir(), "coodance-smoke-" + Date.now() + ".txt");
              await new Promise((resolve, reject) => {
                const child = spawn(exePath, ["--no-sandbox"], {
                  env: {
                    ...process.env,
                    COODANCE_SMOKE_TEST: "1",
                    COODANCE_SMOKE_RESULT_FILE: resultFile,
                    ELECTRON_ENABLE_LOGGING: "1",
                  },
                  stdio: ["ignore", "pipe", "pipe"],
                });
                let out = "";
                child.stdout.on("data", (d) => { out += d.toString(); process.stdout.write(d); });
                child.stderr.on("data", (d) => { out += d.toString(); process.stderr.write(d); });
                const timer = setTimeout(() => {
                  child.kill();
                  reject(new Error("Packaged Electron smoke test timed out after 60s.\n" + out));
                }, 60000);
                child.on("exit", (code) => {
                  clearTimeout(timer);
                  const fileOut = fs.existsSync(resultFile) ? fs.readFileSync(resultFile, "utf8") : "";
                  if (fileOut) {
                    process.stdout.write(fileOut);
                    try { fs.unlinkSync(resultFile); } catch {}
                  }
                  const combined = out + "\n" + fileOut;
                  if (code === 0 && combined.includes("[coodance-smoke] PASS")) resolve();
                  else reject(new Error("Packaged Electron smoke test failed (code=" + code + ")\n" + combined));
                });
              });
            }

            async function runMcpSmoke() {
              await new Promise((resolve, reject) => {
                const child = spawn(exePath, [mcpPath], {
                  env: { ...process.env, ELECTRON_RUN_AS_NODE: "1" },
                  stdio: ["pipe", "pipe", "pipe"],
                });
                let stdout = "";
                let stderr = "";
                let done = false;
                const finish = (err) => {
                  if (done) return;
                  done = true;
                  clearTimeout(timer);
                  child.kill();
                  if (err) reject(err);
                  else resolve();
                };
                const check = () => {
                  if (stdout.includes("coodance_import_asset") && stdout.includes("coodance_save_edit_plan")) {
                    console.log("[coodance-mcp-smoke] PASS bundled stdio.mjs via ELECTRON_RUN_AS_NODE=1");
                    finish();
                  }
                };
                child.stdout.on("data", (d) => { stdout += d.toString(); check(); });
                child.stderr.on("data", (d) => { stderr += d.toString(); });
                child.on("exit", (code) => {
                  if (!done) {
                    finish(new Error("Packaged MCP stdio exited early (code=" + code + ").\nSTDOUT: " + stdout + "\nSTDERR: " + stderr));
                  }
                });
                const timer = setTimeout(() => {
                  finish(new Error("Packaged MCP stdio smoke timed out after 15s.\nSTDOUT: " + stdout + "\nSTDERR: " + stderr));
                }, 15000);
                child.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 1, method: "initialize", params: { protocolVersion: "2024-11-05", capabilities: {}, clientInfo: { name: "ci", version: "1.1.1" } } }) + "\n");
                child.stdin.write(JSON.stringify({ jsonrpc: "2.0", method: "notifications/initialized", params: {} }) + "\n");
                child.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }) + "\n");
              });
            }

            (async () => {
              await runAppSmoke();
              await runMcpSmoke();
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          '
      - name: List generated release artifacts
        shell: bash
        run: ls -lh release/
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          compression-level: 0
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-and-verify, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Generate SHA256 checksums
        working-directory: dist-release
        run: |
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat << 'EOF' > /tmp/release-notes.md
          ## CooDance Studio ${TAG}

          **纯代码化（Code-as-Video）16:9 自动化视频生产工作台与管线**，统一支持 **Web 自托管、Windows 桌面、macOS 桌面** 与 **全套兼容 CLI 脚本**。

          ### 本次修复与优化（v1.1.1）
          - **修复 Windows / macOS 打包版启动无窗口与僵尸进程**：补齐 `react` / `react-dom` 与 `@coodance/remotion` 打包依赖，改为按需懒加载 Remotion 与 `simple-icons`，修复错误被吞导致的误导性 `apps/server/dist/app.js` 报错，并增加启动错误弹窗兜底与单实例防重复打开。
          - **新增暗色即时启动页 & 显著提速瘦身**：双击即显启动加载页；将离线 MCP 打包为单文件 `resources/mcp/stdio.mjs` 并按平台剔除冗余跨平台 `ffprobe` 与 3,472 个散装 SVG，解包文件数下降 93%（6,681 → 472），安装包体积瘦身 326 MB，大幅减少 Windows Defender 首次扫描耗时。
          - **新增打包后实机冒烟门禁**：CI 构建完成后自动启动打包产物验证 `/api/health`、前端挂载与离线 `ELECTRON_RUN_AS_NODE=1` MCP `stdio.mjs`。

          ### 核心特性
          - **外部 AI Agent 接入（MCP + Skill 协同引擎）**：内置 `@coodance/mcp`（11 个强校验 `coodance_*` 工具 + 4 个渐进式 Resources，同时支持 **Streamable HTTP `/mcp`** 与 **零依赖离线 `stdio` / `ELECTRON_RUN_AS_NODE=1`**），配套 5 阶段 `coodance-video-producer` Skill 规范包与工作台「Agent 接入中心」一键安全安装器（自动 `.bak` 备份合并 Cursor / Claude Code / Claude Desktop / Antigravity / Cherry Studio）。
          - **四大质量与安全护栏**：`edit_plan.json` 写前强校验门禁（Zod + 时间轴无断层/重叠 + 素材存在性 + `zoomRegion` 检查）、`coodance_import_asset` 统一外部素材入库（本地/URL/Base64/SVG 自动 FFprobe 探测）、写前自动 Git 快照、异步非阻塞渲染 Job + TTS 哈希缓存与付费豆包保护开关。
          - **5 阶段自动化视频管线**：项目初始化 (`init-project.mjs`) → 逐句 TTS 哈希缓存 + 10ms RMS 静音/气口裁切 (`tts.mjs`) → FFprobe 素材清单与均匀抽帧场记 (`inspect-assets.mjs`) → 声明式分镜校验与资源扩展 (`validate-edit-plan.mjs` / `fetch-logo.mjs` / `fetch-tg-emoji.mjs` / `generate-sfx.mjs`) → Remotion 4.0.414 无头 H.264 MP4 渲染 (`render-project.mjs`) 与独立工程 Git 时间戳快照 (`snapshot.mjs`)。
          - **可视化创作工作台**：内嵌 `@remotion/player` 16:9 实时预览、5 轨同步时间轴、画面拖拽框选局部缩放 (`zoomRegion`)、视频缩略图一键绑定 `trimStartSec`，以及属性表单与 `edit_plan.json` 源码双向热同步。
          - **多引擎配音与零配置开箱即用**：主推火山引擎豆包语音合成 2.0 (`seed-tts-2.0`)，支持 Edge-TTS 与本地离线节奏语音降级；桌面安装包内置 `ffmpeg-static` / `ffprobe-static` 并支持可选固定本地 MCP 端口 `4170`。
          - **Web / Docker 自托管**：执行 `docker compose up -d` 或 `npm ci && npm run build && npm start` 即可部署个人/私有 Web 工作台与远程 Bearer 鉴权 MCP 端点。

          ### 下载说明
          - **Windows (x64)**：`*-win-x64-setup.exe`（安装版）或 `*-win-x64-portable.zip`（免安装便携版，解压即用）
          - **macOS (Apple Silicon / Intel)**：`*-mac-arm64.dmg`（M 系列芯片）或 `*-mac-x64.dmg`（Intel 芯片）
          - **校验文件**：`SHA256SUMS.txt`
          EOF
          sed -i "s/\${TAG}/${TAG}/g" /tmp/release-notes.md
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "CooDance Studio ${TAG}" --notes-file /tmp/release-notes.md
            gh release upload "${TAG}" dist-release/* --clobber
          else
            gh release create "${TAG}" dist-release/* \
              --title "CooDance Studio ${TAG}" \
              --notes-file /tmp/release-notes.md \
              --generate-notes
          fi
