appId: app.coodance.studio
productName: CooDance Studio
copyright: Copyright © 2026 CooDance Contributors
electronVersion: "35.7.5"
npmRebuild: false
publish: null
directories:
  output: ../../release
  buildResources: build-resources
files:
  - dist/**/*
  - package.json
  - "!**/node_modules/simple-icons/icons/**"
  - "!**/node_modules/simple-icons/data/**"
  - "!**/node_modules/simple-icons/index.mjs"
  - "!**/node_modules/@coodance/*/src/**"
  - "!**/node_modules/**/*.map"
extraResources:
  - from: ../web/dist
    to: apps/web/dist
  - from: ../../packages/remotion/src
    to: packages/remotion/src
  - from: ../../packages/remotion/package.json
    to: packages/remotion/package.json
  - from: ../../packages/mcp/dist/stdio.bundle.mjs
    to: mcp/stdio.mjs
  - from: ../../skills/coodance-video-producer
    to: skills/coodance-video-producer
asar: true
asarUnpack:
  - "**/ffmpeg-static/**"
  - "**/ffprobe-static/**"
  - "**/@remotion/compositor-*/**"
  - "**/@remotion/bundler/**"
  - "**/@remotion/renderer/**"
  - "**/@esbuild/**"
  - "**/simple-icons/index.js"
  - "**/simple-icons/package.json"
mac:
  category: public.app-category.video
  icon: build-resources/icon.png
  identity: null
  artifactName: CooDance-Studio-${version}-mac-${arch}.${ext}
  files:
    - "!**/node_modules/ffprobe-static/bin/win32/**"
    - "!**/node_modules/ffprobe-static/bin/linux/**"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  darkModeSupport: true
dmg:
  title: CooDance Studio
win:
  icon: build-resources/icon.png
  files:
    - "!**/node_modules/ffprobe-static/bin/darwin/**"
    - "!**/node_modules/ffprobe-static/bin/linux/**"
    - "!**/node_modules/ffprobe-static/bin/win32/ia32/**"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: CooDance-Studio-${version}-win-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: CooDance-Studio-${version}-win-${arch}-portable.${ext}
linux:
  icon: build-resources/icon.png
  artifactName: CooDance-Studio-${version}-linux-${arch}.${ext}
  files:
    - "!**/node_modules/ffprobe-static/bin/darwin/**"
    - "!**/node_modules/ffprobe-static/bin/win32/**"
    - "!**/node_modules/ffprobe-static/bin/linux/ia32/**"
  target:
    - AppImage
  category: AudioVideo
